name: Build print page
on:
  push:
    branches: [main]
    paths: ['print-source/**', '.github/workflows/build-print.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: build-print
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build browser app
        working-directory: print-source
        run: |
          npm install --ignore-scripts
          npm run build
      - name: Publish generated files
        run: |
          mkdir -p print
          cp -a print-source/dist/. print/
          cp print-source/LICENSE print-source/PRIVACY.md print-source/THIRD_PARTY_NOTICES.md print/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add print print-source/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Build HWP print page for GitHub Pages"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Request Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
