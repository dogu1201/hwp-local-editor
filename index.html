<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>내 문서 · HWP 편집기</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:'맑은 고딕',sans-serif;background:#f3f5f8;color:#172d40}body{display:flex;flex-direction:column}header{display:flex;align-items:center;gap:20px;padding:12px 22px;background:white;border-bottom:1px solid #dce3ea}h1{font-size:18px;margin:0;white-space:nowrap}h1 span{background:#14695d;color:#fff;border-radius:9px;padding:7px 9px;margin-right:9px;font-size:13px}#name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:#5a6c79}button{padding:9px 17px;border:1px solid #cbd5df;border-radius:7px;background:#fff;color:#243947;font:inherit;font-size:13px;cursor:pointer}button:hover{background:#edf3f7}button:disabled{opacity:.45;cursor:wait}.primary{background:#14695d;color:white;border-color:#14695d}.primary:hover{background:#10584f}#hint{margin:0;padding:8px 22px;font-size:12px;background:#edf6f1;border-bottom:1px solid #dce7df;color:#385c4b}#editor{flex:1;min-height:0}#editor iframe{border:0;display:block}footer{font-size:11px;padding:6px 22px;background:white;display:flex;justify-content:space-between;color:#617483}#overlay{position:absolute;inset:135px 0 30px;display:grid;place-content:center;text-align:center;pointer-events:none;background:#f3f5f8}#overlay h2{font-size:28px}#overlay p{color:#65788a;line-height:1.8}#overlay[hidden]{display:none}.error{color:#b12626!important}@media(max-width:800px){header{gap:8px;padding:10px}#name{display:none}button{padding:8px}h1{font-size:15px}}
</style></head><body>
<header><h1><span>H</span>내 문서</h1><div id="name">문서를 선택해 시작하세요</div><button id="open" disabled>파일 열기</button><button id="save" class="primary" disabled>수정본 HWP 저장</button></header>
<p id="hint">파일을 열고 문서 안을 클릭해 바로 편집하세요. 표·글자 모양은 아래 메뉴에서 바꿀 수 있습니다.</p>
<main id="editor"></main><section id="overlay"><h2>한글 문서, 바로 편집하세요.</h2><p id="welcome">편집기를 준비하고 있습니다…</p></section>
<footer><span id="status" role="status">시작 중</span><span>로컬 실행 · RHWP 오픈소스 기반</span></footer>
<input type="file" id="picker" accept=".hwp,.hwpx" hidden>
<script type="module" src="/app.js"></script></body></html>
