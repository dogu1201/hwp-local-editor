<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>내 문서 · HWP 편집기</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:'맑은 고딕',sans-serif;background:#f3f5f8;color:#172d40}body{display:flex;flex-direction:column}header{display:flex;flex-wrap:wrap;align-items:center;gap:20px;padding:12px 22px;background:white;border-bottom:1px solid #dce3ea}h1{font-size:18px;margin:0;white-space:nowrap}h1 span{background:#14695d;color:#fff;border-radius:9px;padding:7px 9px;margin-right:9px;font-size:13px}#name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:#5a6c79}button{white-space:nowrap;padding:9px 17px;border:1px solid #cbd5df;border-radius:7px;background:#fff;color:#243947;font:inherit;font-size:13px;cursor:pointer}button:hover{background:#edf3f7}button:disabled{opacity:.45;cursor:wait}.primary{background:#14695d;color:white;border-color:#14695d}.primary:hover{background:#10584f}#hint{margin:0;padding:8px 22px;font-size:12px;background:#edf6f1;border-bottom:1px solid #dce7df;color:#385c4b}#editor{position:relative;flex:1;min-height:0;isolation:isolate}#editor iframe{border:0;display:block}footer{font-size:11px;padding:6px 22px;background:white;display:flex;justify-content:space-between;color:#617483}#overlay{position:absolute;inset:0;z-index:1;display:grid;place-content:center;text-align:center;background:#f3f5f8}#overlay h2{font-size:28px}#overlay p{color:#65788a;line-height:1.8}#overlay[hidden]{display:none}.error{color:#b12626!important}@media(max-width:800px){header{gap:8px;padding:10px}#name{display:none}button{padding:8px}h1{font-size:15px}}
#hint{height:40px;min-height:0;max-height:56px;padding:0;border:0;flex-shrink:0;overflow:hidden}#hint span{display:block;padding:8px 22px;border-bottom:1px solid #dce7df}#hint-resize{height:7px;flex-shrink:0;background:#dce7df;cursor:ns-resize;touch-action:none}#hint-resize:hover,#hint-resize:focus{background:#14695d}header,footer{flex-shrink:0}.templates-wrap{position:relative}#templates-toggle{padding:6px 10px;font-size:12px}#templates{position:absolute;top:100%;left:0;z-index:10;background:white;border:1px solid #cbd5df;padding:6px;border-radius:8px;box-shadow:0 5px 15px #0002}#templates button{display:block;border:0;width:100%;text-align:left;font-size:12px}#drop-shield{position:fixed;inset:0;z-index:100}#drop-shield span{display:none}#drop-shield.dragging{display:grid;place-items:center;background:#14695ddd;border:4px dashed white;color:white;font-size:22px}#drop-shield.dragging span{display:block}#drop-shield[hidden]{display:none}
header{position:relative;z-index:101}
#templates[hidden]{display:none}
</style></head><body>
<header><h1><span>H</span>내 문서</h1><div id="name">새 문서를 작성하거나 파일을 여세요</div><div class="templates-wrap"><button id="templates-toggle" aria-expanded="false" aria-controls="templates" disabled>서식 ▾</button><div id="templates" hidden><button data-file="activity.hwp" data-name="활동일지.hwp">활동일지</button><button data-file="discussion.hwp" data-name="학생산출물_토의토론(개별_제출).hwp">학생산출물 · 토의토론</button></div></div><button id="open" disabled>파일 열기</button><button id="new" disabled>새 문서 작성</button><a href="https://dogu1201.github.io/hwp-local-editor/print/" target="_blank" rel="noopener noreferrer" style="font-size:12px;color:#14695d">인쇄 페이지 ↗</a><button id="save" class="primary" disabled>수정본 HWP 저장</button></header>
<p id="hint"><span>새 문서를 만들거나 파일을 열고 문서 안을 클릭해 편집하세요. 표·글자 모양은 아래 메뉴에서 바꿀 수 있습니다.</span></p>
<div id="hint-resize" role="separator" aria-label="안내 영역 높이 조절" aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="56" aria-valuenow="40" tabindex="0" title="위로 끌어 안내 접기 · 아래로 끌어 펼치기"></div><main id="editor"><section id="overlay"><h2>한글 문서, 바로 편집하세요.</h2><p id="welcome">편집기를 준비하고 있습니다…</p></section></main>
<footer><span id="status" role="status">시작 중</span><span>브라우저 편집 · RHWP 오픈소스 기반</span></footer>
<div id="drop-shield" hidden><span>HWP / HWPX 파일을 놓으면 편집합니다</span></div><input type="file" id="picker" accept=".hwp,.hwpx" hidden>
<script type="module" src="./app.js"></script></body></html>
